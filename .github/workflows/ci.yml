name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Two jobs need a clock rather than a commit. The cold-sync test walks every key block
  # the network has published since the block the config pins, which is minutes and tens
  # of megabytes off a public liteserver. The advisory check has to rerun on code that
  # has not changed, because an advisory is published against a version already merged.
  schedule:
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always

# Nothing here writes anything back. Stated rather than left to the repository
# default, because the default is settable and a workflow that reads its rights off
# a setting has none of its own.
permissions:
  contents: read

# A push that lands while the previous one is still running makes the earlier
# answer irrelevant, so it is cancelled rather than raced. Not on main: a run there
# is what a merged commit is judged by.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A fork that enables Actions inherits the daily schedule, and the work it would do
# there is a walk over public mainnet blocks that answers a question about this
# repository. Each job names the repository so the schedule runs in one place, while
# a push or a pull request from a fork still runs everything.
#
# The Node binding gets its own job as that layer lands in the v0.1.0 plan. The
# hermetic gate covers the library; the network job runs the ignored tests that
# reach a live liteserver; the spike job covers the standalone projects the gate
# cannot see.
jobs:
  conventions:
    name: headers, pins, justfile, toml, spelling
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.57.0,taplo@0.10.0,typos@1.48.0
      # Until this step the justfile was the one build input no build read. Every job
      # here invokes the underlying commands directly, so a justfile that does not
      # parse leaves CI green while every command a contributor is told to run fails,
      # and a duplicate recipe name reached main that way. A recipe name is not checked
      # against anything else; parsing is the whole of what can be checked cheaply.
      - name: justfile parses
        run: just --list > /dev/null
      # Nineteen TOML files carry the workspace, the lint policy, the license policy
      # and the release configuration, and each was formatted by whoever touched it
      # last. `.editorconfig` had declared two-space indentation for them the whole
      # time while every file used four, so this is what makes that declaration true.
      - name: toml formatted
        run: RUST_LOG=warn taplo fmt --check
      # The argument for why a check exists is written next to the check here, so the
      # comments and the documentation are a larger surface than the code, and they are
      # the part no compiler and no linter reads. Fixtures are excluded in _typos.toml:
      # a captured mainnet address is an arbitrary string and will spell near-misses.
      - name: spelling
        run: typos
      # Every file carries a copyright holder and a license identifier, in its own
      # header where the format allows a comment and in REUSE.toml where it does not.
      # A convention this wide decays without a check, so this one fails the build.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      # A third-party action runs with this job's token, so a moved tag is somebody
      # else's code arriving here without a commit. The same check covers the two
      # settings that stay invisible until they matter: what a workflow may write, and
      # whether a fork's schedule spends runners answering a question about this
      # repository.
      - name: workflows pinned and scoped
        run: node scripts/check-workflows.mjs

  check:
    name: fmt, clippy, docs, tests
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: format
        run: cargo fmt --all -- --check
      # The second line of each pair is what reaches the feature-gated code. The default
      # build leaves `compress`, `json` and `parallel` off, so without it their code and
      # their documentation are written once and then read by nothing.
      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-features --all-targets -- -D warnings
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --all-features
      - name: tests
        run: |
          cargo test
          cargo test --all-features
      # The bare `cargo test` two lines up compiles and runs the default build, so this is
      # not asking whether that build works. It asks which dependencies that build carries
      # and which one only a feature pulls. `scripts/check-default-deps.mjs` carries the
      # reasoning, including why the answer for `net` is read with the features off rather
      # than in the default build.
      - name: optional dependencies stayed optional
        run: node scripts/check-default-deps.mjs
      # Which way the layers run, read out of the source text rather than out of a crate
      # graph. The graph was the old answer and it never held: `std` needs no dependency
      # edge, so a socket opened in a layer that only decides changed no manifest.
      - name: the layers run one way
        run: node scripts/check-layers.mjs

  mutants:
    name: would a test notice a missing check
    # Slow, and it answers a question that does not change between two commits on the
    # same day, so it runs on the daily schedule rather than on every push.
    if: github.event_name == 'schedule' && github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-mutants
      # Removes one check at a time and reruns the suite. A passing suite says the code
      # does what the tests ask; this says whether the tests would notice if it stopped.
      # That is the question worth asking about a library whose job is refusing things.
      # Mutants judged unkillable rather than untested are excluded in
      # .cargo/mutants.toml, each with the reason.
      #
      # The package is the whole library now, where it used to be the two crates that
      # decode and verify. Nothing narrower is available without naming source paths here,
      # and a path list in a workflow is a second copy of the layout that goes stale the
      # first time a module moves.
      - name: the library
        run: cargo mutants -p ton-net --timeout 120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: mutants.out/
          retention-days: 14

  fuzz:
    name: the decode boundary at length
    # The same targets the gate's own `cargo test` runs on every push, at a budget that
    # takes about half an hour rather than a second and a half: docs/fuzzing.md measures
    # a quarter of a million cases per target at about seven minutes, so the million below
    # is around thirty. Like the mutation run, the answer does not change between two
    # commits on the same day, so it runs on the daily schedule.
    if: github.event_name == 'schedule' && github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # Bytes a peer chose, read as values this client trusts. The seed is fixed, so a case
      # that fails here reproduces from the two numbers the log printed; docs/fuzzing.md
      # says how, and says why this is not a release profile.
      - name: cell decode boundary
        env:
          TON_NET_FUZZ_ITERATIONS: 1000000
        run: cargo test -p ton-net --all-features fuzz -- --nocapture

  deny:
    name: advisories, licenses, duplicates, sources, notices
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny,cargo-about@0.9.1
      # Also on the daily schedule, and that is the half most projects leave out: an
      # advisory is published against a version that merged weeks ago, so a check that
      # only runs on a diff never sees it. Every rule and its exceptions are in
      # deny.toml, including why the crypto stack sits at two generations.
      - name: dependency tree
        run: cargo deny check
      # The other end of the same policy, which is why it shares this job and its
      # schedule: deny.toml gates what enters the tree, about.toml gates what gets
      # attributed on the way out, and about.toml holds the argument for why the two
      # allow lists mirror each other. A dependency bump breaks both at once.
      #
      # The generator is pinned because this step compares its output against a
      # committed file. An unpinned one that changes its rendering produces the same
      # diff as a moved dependency, and the message below would then send a reader
      # looking for a bump that never happened.
      #
      # The comparison runs through git rather than diff on purpose. The generator
      # emits CRLF where an upstream license text carries it and the committed blob is
      # LF, so only .gitattributes normalizing both sides makes the two comparable.
      - name: notices match the dependency tree
        run: |
          cargo about generate --manifest-path bindings/node/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES.md
          git diff --stat --exit-code THIRD-PARTY-LICENSES.md \
            || { echo "::error::THIRD-PARTY-LICENSES.md no longer describes what the npm tarballs ship; run \`just notices\` and commit the result"; exit 1; }

  wasm:
    name: the core still builds for the browser
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # A browser binding is not here yet, and by the time it is the decision that matters
      # is already made: whether the protocol logic stayed free of the runtime. The line
      # that decides it is the `net` feature rather than a set of package names, so this
      # turns the feature off and builds what is left. That reaches wider than the three
      # crates it used to name: everything the library decides rather than fetches has to
      # compile with no threads, no sockets and no clock, which is the cell engine, the
      # typed structures, the TL codec, the proof engine, the ADNL handshake and frame
      # ciphers, `Verified`, address parsing and the config reader. What `net` holds back is
      # the socket and the randomness it draws, and with them the three consumers of the
      # transport seam: the ADNL message layer, the liteserver query client, and `Client`.
      - name: the library without the socket, on wasm32
        run: cargo build --target wasm32-unknown-unknown --no-default-features
      # A build says the code compiles; it does not say the capabilities the manifest
      # names are still reachable. This runs on the host, because the question is which
      # items survive the feature and not which target they run on.
      - name: what the build without the socket still carries
        run: |
          cargo test --no-default-features --test sans_io
          cargo check --no-default-features --all-targets

  release-ready:
    name: versions and packaging
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # One library version across two registries. release-plz moves the Cargo
      # side and napi moves the npm side, neither reads the other, so without this
      # they drift and two artifacts claim to be the same library at different
      # numbers.
      - name: one version everywhere
        run: node scripts/check-versions.mjs
      # The same failure one step out from a number: a count stated in prose about a
      # set the compiler owns. The facade's re-export list and a crate's feature table
      # both move in commits that have no reason to open the document counting them,
      # and every other check here reads spelling, links or types rather than a census.
      - name: stated counts match what they count
        run: node scripts/check-surface-census.mjs
      # What crates.io would accept, including the metadata it requires and the
      # files each package would carry. Cargo resolves the inter-crate
      # dependencies through a temporary local registry, so this runs before the
      # first crate is published rather than only after.
      - name: crates would publish
        run: cargo publish --dry-run --workspace

  msrv:
    name: msrv 1.85 core, 1.88 binding
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # rust-toolchain.toml selects stable for any command that does not name a
      # toolchain, including here, so the floor is passed explicitly. Without the
      # +version this job would build on stable and report the floor as met.
      - name: core floor
        run: cargo +1.85.0 build
      # napi-rs 3 raises the binding above the core floor, and nothing checked it
      # until now, so the manifest could claim a floor no build had ever tried.
      - name: binding floor
        run: cargo +1.88.0 build -p ton-net-node

  network:
    name: network integration
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # The ignored tests reach a live mainnet liteserver. Each skips if its server is
      # unreachable, so liteserver rotation does not fail the build, but a real protocol
      # regression does.
      - name: network tests
        run: cargo test -- --ignored --skip cold_sync --skip snapshot
      # Only on the daily schedule: the full walk from the config's init block.
      - name: cold sync
        if: github.event_name == 'schedule'
        run: cargo test -- --ignored cold_sync
      # Also daily, and deliberately not on a pull request. How much of the bundled
      # config is left changes with the network rather than with a commit, so failing a
      # contributor's branch over it would report somebody else's liteserver going down
      # as their mistake.
      - name: is the bundled config still current
        if: github.event_name == 'schedule'
        run: cargo test -p ton-net --test snapshot -- --ignored --nocapture

  node:
    name: node binding
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # napi-rs 3.x needs a newer toolchain than the core floor; stable satisfies it.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: install
        working-directory: bindings/node
        run: npm install
      - name: clippy
        run: cargo clippy -p ton-net-node --all-targets -- -D warnings
      # The binding is a workspace member but not a default one, so the hermetic job's
      # doc gate does not reach it. Without this its broken-link lint never runs, on the
      # one crate whose doc comments are copied verbatim into the published index.d.ts.
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p ton-net-node
      - name: build addon
        working-directory: bindings/node
        run: npx napi build --platform
      # The loader and the type definitions are generated from the Rust binding and
      # tracked, because the definitions are the published JavaScript API and the doc
      # comments a caller reads in an editor. Regenerating them here and refusing a
      # diff is what keeps the committed surface the one that actually ships.
      - name: generated surface is current
        working-directory: bindings/node
        run: git diff --exit-code -- index.js index.d.ts
      # An npm package cannot be replaced once published, only deprecated, so a
      # tarball missing its license or shipping the Rust sources is permanent.
      - name: packages are publishable
        working-directory: bindings/node
        run: npm run check-package
      # The Rust examples are compiled by clippy, which reaches every target. Nothing
      # reached these, so they are at least parsed. It is the weaker of the two checks
      # and still catches what matters most about a stale example, which is that a reader
      # trusts one more than they trust their own guess.
      - name: examples parse
        working-directory: bindings/node
        run: |
          for example in examples/*.mjs; do
            node --check "$example"
          done
      # The gate test reaches mainnet and skips if no liteserver is reachable. It walks
      # the chain either way; what the schedule adds is the walk from the block the config
      # pins, which runs over every key block published since.
      - name: gate test
        if: github.event_name != 'schedule'
        working-directory: bindings/node
        run: node test.mjs
      - name: gate test with the first sync
        if: github.event_name == 'schedule'
        working-directory: bindings/node
        env:
          TON_NET_COLD_SYNC: "1"
        run: node test.mjs

  spikes:
    name: spike lint
    if: github.event_name != 'schedule' || github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      # Each spike is a standalone project with its own lockfile, excluded from the
      # workspace, so --all-targets above never reaches one. Unlinted they rot: every
      # clippy release adds lints, and the drift surfaces as a wall of unrelated
      # errors for whoever next opens the file. A spike is committed evidence, so the
      # fix is always lint-only, but it is cheaper the day the lint appears. Only fmt
      # and clippy run here; a spike has no tests and publishes no docs. The glob
      # covers a new spike without touching this file.
      - name: fmt and clippy
        run: |
          for manifest in spikes/*/Cargo.toml; do
            echo "== ${manifest%/Cargo.toml} =="
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done
