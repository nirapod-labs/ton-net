# Publishes a tagged version to crates.io and npm, holding no long-lived credential.
#
# # It cannot run the first release, and that is a property of the registries
#
# A trusted publisher is configured on a crate or a package that already exists.
# crates.io has no equivalent of PyPI's pending publisher, and npm has none either, so
# there is nothing to attach a publisher to until a name is taken. The first version of
# the crate and the eight packages goes out by hand with a token, the nine publishers are
# configured against this file, and the tokens are then revoked. Every release after that
# is this workflow. docs/release-process.md carries the sequence.
#
# Until that has happened this workflow runs and stops at the first publish, which is
# the honest failure: it says the trusted publisher is not configured, rather than
# reaching for a secret that should not exist.
#
# # Why an environment
#
# Both registries let a trusted publisher be scoped to a GitHub environment, and this
# one is scoped to `release`. With a required reviewer on that environment the OIDC
# token cannot be minted until a person approves the run, so pushing a tag is not by
# itself enough to publish. For a library whose whole claim is that it verifies rather
# than trusts, its own supply chain having a human gate is proportionate.
#
# # Order
#
# There is one crate, so crates.io has no order left to get wrong: the dependency graph
# that used to decide it is inside the library now. The five names that carried the layers
# before it, `ton-net-tl`, `ton-net-cell`, `ton-net-adnl`, `ton-net-block` and
# `ton-net-lite`, are still published at 0.4.2 and are not yanked, so anything already
# resolving them keeps resolving them; this workflow no longer publishes any of them.
# npm still has an order: the platform packages are optional dependencies of the main one,
# so they exist before it names them.
name: release

on:
  push:
    tags: ["v*"]
  # A tag is pushed once, and a job that fails after the crates are published leaves a
  # release half out with no way to finish it: re-running replays the workflow as it was
  # at the tag, so a fix on the default branch never reaches it. That happened on v0.4.0.
  # A dispatch runs this file from the branch it is dispatched from, against the tag it
  # names, and skips the registry the push already reached.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to finish publishing.
        required: true

env:
  CARGO_TERM_COLOR: always
  # A push carries the tag in its ref. A dispatch runs from the default branch, so its
  # ref names that branch and the tag has to be said.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# The floor, raised per job where a job earns it. `id-token: write` is the whole
# credential story and belongs only to the two jobs that publish: it lets them ask
# GitHub for an OIDC assertion, which each registry exchanges for a token good for
# minutes. Nothing here reads a secret.
permissions:
  contents: read

# A tag is published once. A second run for the same tag would find every version
# already taken and fail halfway through proving it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is not evidence that the tree is good; the commit it points at may never
  # have had a full run. Publishing is irreversible on crates.io, which yanks but never
  # deletes, so the gate runs again here rather than being assumed.
  gate:
    if: github.repository == 'nirapod-labs/ton-net'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.57.0,taplo@0.10.0,typos@1.48.0
      # `just gate` runs `reuse lint`, which is not on the runner.
      - run: pipx install reuse
      - name: the tag matches the manifests
        run: |
          set -euo pipefail
          tagged="${RELEASE_TAG#v}"
          declared=$(node -p "require('./bindings/node/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $RELEASE_TAG does not match the declared version $declared"
            exit 1
          fi
          node scripts/check-versions.mjs
      - run: just gate

  crates:
    # Last, and after npm, because crates.io yanks but never deletes while npm admits an
    # unpublish for a time. The irreversible commitment is not made until every reversible
    # one has succeeded, so a failure anywhere else costs no version.
    needs: [gate, npm]
    # A dispatch is for finishing a release whose crates are already out. Publishing a
    # version twice is an error on crates.io, not a no-op.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Scoped to the environment the trusted publishers name. A required reviewer here
    # is what makes a tag push insufficient on its own.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2

      # Exchanges this run's OIDC assertion for a crates.io token that expires in
      # about half an hour, exported as CARGO_REGISTRY_TOKEN. No secret is read and
      # none exists to leak.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # `--no-verify` is deliberately absent: the package is built from the tarball that
      # will be published, which is the last chance to catch a crate that compiles in the
      # workspace and not on its own. The binding is a workspace member and sets
      # `publish = false`, so naming the library is what keeps it out.
      - name: publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ton-net

  npm:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      # Reading another workflow's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Trusted publishing needs node 22.14.0 and npm 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      # Built by build-binding.yml, which fires on the same tag. Publishing what that
      # matrix produced rather than rebuilding here means the binaries that were loaded
      # and smoke tested are the binaries that ship.
      #
      # That is a different workflow, and download-artifact only sees the current run
      # unless it is told which run to look in. Matching on the commit rather than the
      # tag name means a moved tag cannot pick up a build of something else.
      - name: find the build that produced the binaries
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The commit the tag names, read from the checkout rather than from the run: on
          # a dispatch the run's own sha is the branch it was dispatched from.
          sha=$(git rev-parse HEAD)
          # Both workflows start on the same push, so this one is usually still running.
          for _ in $(seq 60); do
            run=$(gh run list --workflow build-binding.yml --commit "$sha" \
                    --limit 1 --json databaseId,status,conclusion \
                    --jq '.[0] | select(.status=="completed" and .conclusion=="success") | .databaseId')
            if [ -n "$run" ]; then
              echo "run-id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::no successful build-binding run for $sha"
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: binding-*
          merge-multiple: true
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: place each binary in its platform package
        working-directory: bindings/node
        run: |
          set -euo pipefail
          # `npm install`, not `npm ci`. The lock cannot name the per-platform packages at
          # a version that is not on the registry yet, and this step runs before they are
          # published, so `npm ci` refuses the tree it is given every time. The node job in
          # `ci.yml` reaches the same conclusion for the same reason.
          npm install --no-audit --no-fund
          # Rebuilds the npm/<target> directories from the napi config, then moves each
          # downloaded .node into the one that names its triple.
          npx napi create-npm-dirs
          npx napi artifacts --output-dir ./artifacts
          # Every platform package must carry exactly one binary, and the main package
          # must name every platform package it will resolve at install time. A missing
          # pair here is a published version that cannot load on the platform it claims.
          node scripts/check-package.mjs

      # The platform packages first: the main package lists them as optional
      # dependencies, and npm resolves those at install time.
      - name: publish the platform packages
        working-directory: bindings/node
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            echo "::group::publish $dir"
            npm publish "$dir" --access public --provenance
            echo "::endgroup::"
          done

      - name: publish the main package
        working-directory: bindings/node
        run: npm publish --access public --provenance

  announce:
    needs: [npm, crates]
    # `always()` so a crates job skipped by a dispatch does not carry this one away. Both
    # registries still have to have not failed.
    if: |
      always() && needs.npm.result == 'success'
      && needs.crates.result != 'failure' && needs.crates.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The release notes are the changelog entry. Writing them twice is how the two
      # come to disagree, so the section for this version is lifted out rather than
      # composed again.
      - name: create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file notes.md
