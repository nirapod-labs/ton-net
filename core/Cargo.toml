[package]
name = "ton-net"
description = "A direct client for the TON network: TL, ADNL, and liteserver over one Rust core."
readme = "README.md"
documentation = "https://docs.rs/ton-net"
homepage = "https://github.com/nirapod-labs/ton-net"
keywords = ["ton", "blockchain", "adnl", "liteserver", "client"]
categories = ["network-programming", "cryptography::cryptocurrencies"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ton-net-lite.workspace = true
ton-net-adnl.workspace = true
ton-net-block.workspace = true
# No feature of ton-net-cell is forwarded, so `json` and `compress` are unreachable
# through this crate whatever the re-export list above them says.
#
# `json` renders a cell tree as a `serde_json::Value`. Forwarding it would put a type
# from a crate this one does not re-export into a facade signature, which is the same
# hole the cell re-exports close, one crate further out, and it would pin this crate's
# public API to serde_json's major version.
#
# `compress` is clean on types, dealing only in `Vec<u8>`, `Cell` and `CellError`, and
# the reason it waits is the build rather than the surface: no read here returns a
# compressed bag and no method takes one, and the gate compiles, lints and documents this
# crate in one configuration, so a feature the gate does not build is code rotting behind
# a flag. That is the same argument the justfile writes beside its `--all-features` lint
# of ton-net-cell. Forward it with the lane that keeps it compiled, when a read or a
# write here handles a compressed bag.
#
# Until then either feature is reached by depending on ton-net-cell, which docs/api-design.md
# already provides for where the need is the cell engine rather than the client.
ton-net-cell.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# Only the timer, to bound every call. The socket and runtime come from the caller.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
] }

[lints]
workspace = true
